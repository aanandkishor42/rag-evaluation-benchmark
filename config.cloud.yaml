# Configuration for free PUBLIC deployment on Streamlit Cloud.
# Uses Groq (free judge LLM) + HuggingFace (free embeddings) - no local models here.
# The Streamlit app reads this file when the RAG_CONFIG env var is set to config.cloud.yaml.
docs_dir: data/sample_docs
test_set: data/test_set.json
results_dir: results

models:
  provider: groq                    # free cloud LLM (OpenAI-compatible)
  base_url: https://api.groq.com/openai/v1
  llm: openai/gpt-oss-20b           # answer generation model on Groq free tier
  judge_llm: openai/gpt-oss-20b     # RAGAS judge LLM on Groq free tier
  embeddings: sentence-transformers/all-MiniLM-L6-v2
  embedding_backend: huggingface    # HF Inference API (needs HF_TOKEN secret)

retrieval:
  top_k: 3

experiments:
  - name: baseline-600-80
    chunk_size: 600
    chunk_overlap: 80
    top_k: 3

  - name: small-300-50
    chunk_size: 300
    chunk_overlap: 50
    top_k: 4

  - name: large-1000-150
    chunk_size: 1000
    chunk_overlap: 150
    top_k: 2